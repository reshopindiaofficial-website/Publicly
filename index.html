<style>

.sw{display:flex;gap:10px;flex-wrap:wrap}.sw1{width:38px;height:38px;padding:0;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw1:hover{background:var(--c)}.sw1.on{box-shadow:0 0 0 2.5px var(--fg)}

/* ===== Modern Professional Refresh ===== */
:root{--bg:#f7f8fa;--fg:#0b1020;--card:#ffffff;--mut:#5a6275;--bd:#e6e8ee;--ac:#0f766e;--ac2:#14b8a6;--f:"Inter Tight","Plus Jakarta Sans","Noto Sans Devanagari",system-ui,sans-serif;--sh:0 1px 2px rgba(11,16,32,.04),0 8px 24px -12px rgba(11,16,32,.12);--sh2:0 30px 60px -30px rgba(11,16,32,.35)}

body{font-size:16px;letter-spacing:-.005em}

header{background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
.logo{font-size:21px;letter-spacing:-.045em}.logo b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
button,.btn{border-radius:10px;font-size:14.5px;padding:10px 16px;box-shadow:0 1px 2px rgba(11,16,32,.05)}
button:hover,.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.pri{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important;box-shadow:0 8px 20px -10px color-mix(in srgb,var(--fg) 60%,transparent)!important}
.pri:hover{filter:brightness(1.15)}
.lsw{border-radius:10px!important}.lsw button{border-radius:8px!important}.lsw button.on{background:var(--fg);color:var(--bg)}
#menu{border-radius:14px;box-shadow:var(--sh2)}

    for(let n=2;;n++){try{await db.runTransaction(async tx=>{const r=db.collection("portfolios").doc(slug);if((await tx.get(r)).exists)throw"taken";tx.set(r,{...data,ek,t:firebase.firestore.FieldValue.serverTimestamp()})});break}catch(e){if(e==="taken"&&n<30){slug=b+"-"+n;continue}throw e}}
    localStorage.setItem("pf_mine",JSON.stringify({slug,key}));location.href="?s="+slug;
  }catch(e){console.error(e);toast(e==="taken"?t("taken"):t("err")+" ("+(e.code||e.message||e)+")");$("pubb").disabled=false}
}

<script>
/* ===== Home mock: asli page jaisa; naye bane pages har 3.5 sec me badalte hain ===== */
(function(){
  const w=document.querySelector(".mockw"),m=w&&w.querySelector(".mock"),pf=document.getElementById("mkpf"),vp=w&&w.querySelector(".mk-vp");
  if(!pf||!m)return;
  const e=x=>String(x||"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
  const col=c=>/^#[0-9a-f]{6}$/i.test(c||"")?c:"#4f46e5";
  const SAMPLE={name:"Meera Creations",owner:"Meera Sharma",loc:"Jaipur",col:"#4f46e5",logo:"",photos:[],sample:true};
  let curP=SAMPLE;
  function draw(p){
    curP=p;m.style.setProperty("--mc",col(p.col));
    const ph=(p.photos||[]).slice(0,1),n=1;
    const gal=ph.length?ph.map(u=>'<img src="'+e(u)+'" alt="">').join(""):(p.sample?'<div class="mkph"></div>':"");
    pf.innerHTML=(p.logo?'<div class="cover has"><img class="cbg" src="'+e(p.logo)+'" alt=""><div class="cin">':'<div class="cover"><div class="cin"><div class="av">'+e((p.name||"?")[0].toUpperCase())+'</div>')+'<span class="chip">'+svg(IC.pin)+e(p.loc)+'</span><h1>'+e(p.name)+'</h1>'+(p.owner?'<p>'+e(p.owner)+'</p>':"")+'</div></div>'
    +'<div class="cta"><a><i>'+svg(IC.ph)+'</i><span>'+t("call")+'</span></a><a><i>'+svg(IC.wa)+'</i><span>'+t("chat")+'</span></a><a><i>'+svg(IC.pin)+'</i><span>'+t("map")+'</span></a></div>'
    +((p.about||p.sample)?'<div class="sec"><h2>'+t("abh")+'</h2><div class="abt">'+(p.sample?e(t("mkabout")):e(p.about).replace(/\n/g,"<br>"))+'</div></div>':"")
    +(gal?'<div class="sec"><h2>'+t("gal")+'</h2><div class="gal">'+gal+'</div></div>':"");
    sz();
  }
  window.mkRedraw=()=>draw(curP);
  const fx=m.querySelector(".mk-fit");
  function sz(){if(!vp||!vp.clientWidth)return;const s=vp.clientWidth/390;vp.style.setProperty("--s",s);vp.style.height=Math.ceil(fx.offsetHeight*s)+"px"}
  const fit=sz;
  fit();addEventListener("resize",fit);if(window.ResizeObserver){const ro=new ResizeObserver(fit);ro.observe(vp);ro.observe(fx)}
  draw(SAMPLE);
  if(typeof db==="undefined"||!db||new URLSearchParams(location.search).get("s"))return;
  db.collection("portfolios").orderBy("t","desc").limit(12).get().then(q=>{
    const L=q.docs.map(d=>d.data()).filter(p=>p&&p.name);if(!L.length)return;
    L.forEach(p=>(p.photos||[]).slice(0,8).concat(p.logo||[]).forEach(u=>{const im=new Image();im.src=u}));
    const dots=document.createElement("div");dots.className="mk-dots";dots.innerHTML=L.map(()=>"<i></i>").join("");if(L.length>1)w.appendChild(dots);
    let n=0;const go=()=>{draw(L[n]);[...dots.children].forEach((d,j)=>d.classList.toggle("on",j===n))};go();
    if(L.length>1)setInterval(()=>{m.classList.add("fade");setTimeout(()=>{n=(n+1)%L.length;go();m.classList.remove("fade")},450)},3500);
  }).catch(err=>console.warn("showcase:",err));
})();
</script>
