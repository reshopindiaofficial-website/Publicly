const $=id=>document.getElementById(id),esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang=localStorage.getItem("pf_l")||"hi",cur=null,owner=false,editing=false,P=[],dip=null,mine=null,tmr;
try{mine=JSON.parse(localStorage.getItem("pf_mine"))}catch(e){}
const t=k=>T[lang][k]||k,num=d=>{d=(d||"").replace(/\D/g,"");return d.length===10?"91"+d:d};
let db;try{firebase.initializeApp(FB);db=firebase.firestore()}catch(e){}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const rk=()=>[...crypto.getRandomValues(new Uint8Array(14))].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,24);
const toast=m=>{const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2400)};
const url=()=>location.origin+location.pathname+"?s="+cur.slug;
function applyLang(){document.documentElement.lang=lang;$("langSel").value=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("logo").innerHTML=BRAND[0]+"<b>"+BRAND[1]+"</b>";document.querySelectorAll(".bn").forEach(e=>e.textContent=BRAND.join(""));$("sh3").textContent=t(editing?"esheet":"nsheet");$("pubb").textContent=t(editing?"save":"pub");if(cur)renderPF()}
function setLang(l){lang=l;localStorage.setItem("pf_l",l);applyLang()}
function tm(e){e.stopPropagation();$("menu").classList.toggle("open")}
document.addEventListener("click",e=>{if(!$("menu").contains(e.target))$("menu").classList.remove("open")});
function view(v){["home","pf"].forEach(x=>$("v-"+x).classList.toggle("on",x===v));document.body.classList.toggle("pfpage",v==="pf")}
async function init(){
  const q=new URLSearchParams(location.search),s=(q.get("s")||"").toLowerCase(),k=q.get("k");
  applyLang();
  if(!s){if(mine&&mine.slug){location.replace("?s="+mine.slug);return}view("home");return}
  view("pf");
  try{
    const d=await db.collection("portfolios").doc(s).get();
    if(!d.exists){$("pf").innerHTML='<div class="cover"><h1>'+t("nf")+'</h1></div><div class="bar"><button class="pri" onclick="location.href=location.pathname">'+t("create")+'</button></div>';return}
    cur=d.data();cur.slug=s;
    const key=k||(mine&&mine.slug===s?mine.key:null);
    owner=!!key&&(await sha(key))===cur.ek;
    if(owner){mine={slug:s,key};localStorage.setItem("pf_mine",JSON.stringify(mine));if(k)history.replaceState(null,"","?s="+s)}
    renderPF();
  }catch(e){$("pf").innerHTML='<div class="cover"><h1>'+t("err")+'</h1></div>'}
}
function renderPF(){
  const c=cur,ph=num(c.ph),wa=num(c.wa||c.ph);document.title=c.name+" – "+BRAND.join("");
  $("ownm").classList.toggle("hide",!owner);
  $("pf").innerHTML='<div class="cover">'+(c.logo?'<img class="lgo" src="'+esc(c.logo)+'" alt="">':'<div class="av">'+esc(c.name[0].toUpperCase())+'</div>')+'<span class="chip">📍 '+esc(c.loc)+'</span><h1>'+esc(c.name)+'</h1>'+(c.owner?'<p>'+esc(c.owner)+'</p>':"")+'</div>'
  +'<div class="cta"><a href="tel:+'+ph+'">'+t("call")+'</a><a href="https://wa.me/'+wa+'">'+t("chat")+'</a><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.loc)+'">'+t("map")+'</a></div>'
  +(c.about?'<div class="sec"><h2>'+t("abh")+'</h2><div>'+esc(c.about).replace(/\n/g,"<br>")+'</div></div>':"")
  +((c.photos||[]).length?'<div class="sec"><h2>'+t("gal")+'</h2><div class="gal">'+c.photos.map(p=>'<img src="'+esc(p)+'" alt="" loading="lazy">').join("")+'</div></div>':"")
  +'<div class="pfm">'+t("mad")+' <b>'+BRAND.join("")+'</b>'+(owner?"":' · <a href="'+location.pathname+'">'+t("mk")+'</a>')+'</div>';
  document.querySelectorAll(".gal img").forEach(i=>i.onclick=()=>{$("lb").querySelector("img").src=i.src;$("lb").classList.add("on")});
}
function thumbs(){$("thumbs").innerHTML=P.map((p,i)=>'<div><img src="'+esc(p)+'" alt=""><button onclick="P.splice('+i+',1);thumbs()">×</button></div>').join("")}
function openSheet(ed){
  editing=!!ed&&!!cur;$("menu").classList.remove("open");
  const v=(id,x)=>$(id).value=x||"";
  v("f_owner",editing?cur.owner:"");v("f_name",editing?cur.name:"");v("f_loc",editing?cur.loc:"");v("f_phone",editing?cur.ph:"");v("f_wa",editing?cur.wa:"");v("f_about",editing?cur.about:"");
  $("shint").textContent="";chk();P=editing?[...(cur.photos||[])]:[];thumbs();LG=editing?(cur.logo||""):"";lprev();
  $("pubb").disabled=false;$("sh3").textContent=t(editing?"esheet":"nsheet");$("pubb").textContent=t(editing?"save":"pub");$("sheet").classList.add("on");
}
function closeSheet(){$("sheet").classList.remove("on")}
const clean=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30);
$("f_name").addEventListener("input",chk);
const dv={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ए":"e","ऐ":"ai","ओ":"o","औ":"au","क":"k","ख":"kh","ग":"g","घ":"gh","च":"ch","छ":"chh","ज":"j","झ":"jh","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"f","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ा":"a","ि":"i","ी":"ee","ु":"u","ू":"oo","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":"","़":""},cn=/[\u0915-\u0939]/;
function slugify(x){const a=[...x];let o="";for(let i=0;i<a.length;i++){const m=dv[a[i]];if(m===undefined){o+=a[i];continue}o+=m;if(cn.test(a[i])&&cn.test(a[i+1]||""))o+="a"}return clean(o)}
function chk(){
  clearTimeout(tmr);const h=$("shint"),v=editing?cur.slug:slugify($("f_name").value);
  if(!v){h.textContent="";return}
  h.className="hint";h.textContent="?s="+v;if(editing)return;
  tmr=setTimeout(async()=>{try{const d=await db.collection("portfolios").doc(v).get();if(slugify($("f_name").value)!==v)return;h.textContent=d.exists?t("taken"):"?s="+v+" · "+t("avail");h.className="hint "+(d.exists?"no":"ok")}catch(e){}},450);
}
let LG="";const lprev=()=>{$("lprev").src=LG;$("lprev").classList.toggle("hide",!LG)};
const shrink=(f,mx=1200)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.82)};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
async function upl(b){const f=new FormData();f.append("file",b);f.append("upload_preset",PRESET);const r=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:f}),j=await r.json();if(!j.secure_url)throw 0;return j.secure_url.replace("/upload/","/upload/f_auto,q_auto,w_1000/")}
$("f_logo").addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;$("pubb").disabled=true;$("lhint").textContent=t("up");try{LG=await upl(await shrink(f,1200));lprev()}catch(e){toast(t("err"))}ev.target.value="";$("lhint").textContent="";$("pubb").disabled=false});
$("f_file").addEventListener("change",async ev=>{
  const fs=[...ev.target.files];$("pubb").disabled=true;$("uph").textContent=t("up");
  for(const f of fs){if(P.length>=8)break;try{P.push(await upl(await shrink(f)));thumbs()}catch(e){toast(t("err"))}}
  ev.target.value="";$("uph").textContent="";$("pubb").disabled=false});
async function pub(){
  const g=id=>$(id).value.trim(),own=g("f_owner"),name=g("f_name"),loc=g("f_loc"),ph=g("f_phone");
  if(!own||!name||!loc||!ph){toast(t("req"));return}
  $("pubb").disabled=true;
  const data={owner:own,name,loc,logo:LG,ph:num(ph),wa:num(g("f_wa"))||num(ph),about:g("f_about"),photos:P};
  try{
    if(editing){await db.collection("portfolios").doc(cur.slug).update({...data,ek:cur.ek});location.href="?s="+cur.slug;return}
    const key=rk(),ek=await sha(key),b=slugify(name)||"shop-"+rk().slice(0,5);let slug=b;
    for(let n=2;;n++){try{await db.runTransaction(async tx=>{const r=db.collection("portfolios").doc(slug);if((await tx.get(r)).exists)throw"taken";tx.set(r,{...data,ek,t:firebase.firestore.FieldValue.serverTimestamp()})});break}catch(e){if(e==="taken"&&n<30){slug=b+"-"+n;continue}throw e}}
    localStorage.setItem("pf_mine",JSON.stringify({slug,key}));location.href="?s="+slug;
  }catch(e){console.error(e);toast(e==="taken"?t("taken"):t("err")+" ("+(e.code||e.message||e)+")");$("pubb").disabled=false}
}
function copy(u){(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(t("copied")),()=>prompt("",u))}
function shareStore(){if(!cur)return;navigator.share?navigator.share({title:cur.name,url:url()}).catch(()=>{}):copy(url())}
function copyEdit(){if(mine)copy(url()+"&k="+mine.key)}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e});
function installApp(){dip?(dip.prompt(),dip=null):toast(t("ins"))}
init();
</script>
